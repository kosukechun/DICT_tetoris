name: Test and prepare console upload
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm test
      - run: python scripts/package_release.py
      - run: python -m pytest
      - run: cfn-lint -r ap-northeast-1 -t infra/cloudformation.yaml infra/cloudfront.yaml
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: aws-console-upload
          path: release/dict-tetoris.zip
